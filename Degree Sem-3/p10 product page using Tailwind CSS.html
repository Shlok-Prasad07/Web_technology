<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

    <nav class="bg-blue-600 text-white p-4">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">MyShop</h1>
            <div class="space-x-4 hidden sm:block">
                <a href="#" class="hover:text-gray-200">Home</a>
                <a href="#" class="hover:text-gray-200">Products</a>
                <a href="#" class="hover:text-gray-200">Contact</a>
            </div>
        </div>
    </nav>

    <section class="max-w-6xl mx-auto p-6">
        <h2 class="text-3xl font-bold text-center mb-8">Our Products</h2>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">

            <div class="bg-white rounded-lg shadow-md overflow-hidden">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSWuMWaYxk3LxjTpyzJ4I2O9p_dVtclza6jEOTL2ZRpvQ&s=10"
                     alt="T-Shirt"
                     class="w-full h-52 object-cover">
                <div class="p-5">
                    <h3 class="text-xl font-bold mb-2">Premium T-Shirt</h3>
                    <p class="text-gray-600 mb-3">
                        Comfortable cotton T-shirt for everyday use.
                    </p>
                    <p class="text-2xl font-bold text-blue-600 mb-4">₹499</p>
                    <button class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">
                        Add to Cart
                    </button>
                </div>
            </div>

            <div class="bg-white rounded-lg shadow-md overflow-hidden">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQNsb5maYpqnkwELPOXfaMugywhRNcCDn7PMO3FXtNA8Q&s=10"
                     alt="Shoes"
                     class="w-full h-52 object-cover">
                <div class="p-5">
                    <h3 class="text-xl font-bold mb-2">Running Shoes</h3>
                    <p class="text-gray-600 mb-3">
                        Lightweight and comfortable shoes for running.
                    </p>
                    <p class="text-2xl font-bold text-blue-600 mb-4">₹999</p>
                    <button class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">
                        Add to Cart
                    </button>
                </div>
            </div>

            <div class="bg-white rounded-lg shadow-md overflow-hidden">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRPBCKq5E2H0WeboqPjgY-8z4s1XZTImw-SVJ3mRzscDQ&s=10"
                     alt="Watch"
                     class="w-full h-52 object-cover">
                <div class="p-5">
                    <h3 class="text-xl font-bold mb-2">Smart Watch</h3>
                    <p class="text-gray-600 mb-3">
                        Stylish smartwatch with modern <br>features.
                    </p>
                    <p class="text-2xl font-bold text-blue-600 mb-4">₹1499</p>
                    <button class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">
                        Add to Cart
                    </button>
                </div>
            </div>

        </div>
    </section>
</body>
</html>
