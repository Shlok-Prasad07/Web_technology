<!DOCTYPE html>
<html>
    <head>
          <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js
"></script>
    </head>
    <body class="bg-light">
        <div class="container py-5">
            <h2 class="text-center mb-4">Product Listing</h2>
            <div class="row g-4">
                <div class="col-md-6">
                    <div class="card shadow">
                        <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30"
                     class="card-img-top"
                     alt="Smart Watch"   style="height: 200px; object-fit: cover;width: 100%;">
                     <div class="card-body">
                        <h5 class="card-title">Smart Watch Pro</h5>
                        <p class="card-text">Fitness Tracking</p>
                        <h4 class="text-primary">2999/-</h4>
                        <button class="btn btn-primary w-100" 
                        data-bs-toggle="collapse"
                        data-bs-target="#checkout">Add to Cart</button>
                     </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card shadow collapse" id="checkout">
                        <div class="card-body">
                            <h4 class="text-center mb-4">Check Out</h4>
                            <form>
                                <div class="mb-3">
                                    <label class="form-lable">
                                        Full Name
                                    </label>
                                    <input type="text" class="form-control" placeholder="Enter Full Name" required />
                                </div>
                                 <div class="mb-3">
                                    <label class="form-lable">
                                        Email
                                    </label>
                                    <input type="email" class="form-control" placeholder="Enter Email" required />
                                </div>
                                <div class="mb-3">
                                    <label class="form-lable">
                                        Adress
                                    </label>
                                    <textarea class="form-control" placeholder="Address"></textarea>
                                </div>
                                <div class="d-flex justify-content-between">
                                    <strong>Total</strong>
                                    <strong>2999</strong>
                                </div>
                                <button class="btn btn-primary w-100">Check Out</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
