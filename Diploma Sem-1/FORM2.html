<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Employee information</title>
    </head>
    <body>
        <form>
            <fieldset>
                 <legend>Employee information</legend>
              <table> 
                <tr>
                    <td>
                            Employee id.:
                    </td>
                    <td>
                        <input type="id" placeholder="id" name="">
                    </td>
                </tr>

                <tr>
                    <td>
                            Employee Name.:
                    </td>
                    <td>
                        <input type="text" placeholder="Full Name" name="">
                    </td>
                </tr>

                <tr>
                    <td>
                           Designation.:
                    </td>
                    <td>
                        <input type=" Designation" placeholder=" Designation" name="">
                    </td>
                </tr>

                <tr>
                    <td>
                          Contact.:
                    </td>
                    <td>
                        <select>
                            <option>+1</option>
                            <option>+44</option>
                            <option>+52</option>
                            <option>+91</option>
                            <option>+86</option>
                        </select>
                        <input type=" Contact" placeholder="+**********" name="">
                    </td>
                </tr>

                <tr>
                    <td>
                           Email.:
                    </td>
                    <td>
                        <input type=" Email" placeholder=" @gmail.com" name="">
                    </td>
                </tr>

                <tr>
                    <td>
                           Job Location.:
                    </td>
                    <td>
                        <select>
                            <option>Andhra Pradesh</option>
                            <option>Arunachal Pradesh</option>
                            <option>Assam</option>
                            <option>Bihar</option>
                            <option>Chhattisgarh</option>
                            <option>Goa</option>
                            <option>Gujarat</option>
                            <option>Haryana</option>
                            <option>Himachal Pradesh</option>
                            <option>Jammu and Kashmir</option>
                            <option>Jharkhand</option>
                            <option>Karnataka</option>
                            <option>Kerala	</option>
                            <option>Madhya Pradesh	</option>
                            <option>Maharashtra	</option>
                            <option>Manipur	</option>
                            <option>Meghalaya</option>
                            <option>Mizoram	</option>
                            <option>Nagaland</option>
                            <option>Odisha	</option>
                            <option>Punjab	</option>
                            <option>Rajasthan</option>
                            <option>Sikkim	</option>
                            <option>Tamil Nadu	</option>
                            <option>Telangana	</option>
                            <option>Tripura</option>
                            <option>Uttar Pradesh	</option>
                            <option>Uttarakhand</option>
                            <option>West Bengal	</option>
                        </select>
                        <input type=" Job Location" placeholder=" Job Location" name="">
                    </td>
                </tr>

                <tr>
                    <td>
                           Education.:
                    </td>
                    <td>
                        <input type=" Education" placeholder=" Education" name="">
                    </td>
                </tr>

                <tr>
                    <td>
                        Marital status.:
                    </td>
                    <td>
                        <select>
                            <option>YES</option>
                            <option>NO</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td>
                           Salary.:
                    </td>
                    <td>
                        <input type=" Salary" placeholder=" Salary" name="">
                    </td>
                </tr>

                <tr>
                    <td>
                        Experience year.:
                    </td>
                    <td>
                        <select>
                            <option>First time</option>
                            <option>1 year</option>
                            <option>2 year</option>
                            <option>3 year</option>
                            <option>4 year</option>
                            <option>5 year</option>
                            <option>6 year</option>
                            <option>7 year</option>
                            <option>8 year</option>
                            <option>9 year</option>
                            <option>10+ year</option>    
                        </select>
                    </td>
                </tr>

                <tr>
                    <td>
                        Gender.:
                    </td>
                    <td>
                        <input type="radio" id="Gender" value="Male" name="Gender">Male
                        <input type="radio" id="Gender" value="Female" name="Gender">Female
                        <input type="radio" id="Gender" value="Other" name="Gender">Other
                    </td>
                </tr>

                <tr>
                    <td>
                        <input type="submit" value="submit">
                    </td>
                </tr>
              </table>
            </fieldset>
        </form>
    </body>
</html>
