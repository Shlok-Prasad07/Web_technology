<!DOCTYPE html>
<html lang="en">
<head>
    <title>doctor form</title>
    <link rel="stylesheet" href="alerat.js">
</head>
<body>
    <form>
        <table border="1">
            <tr>
                <td rowspan="10"><img src="doctor.png"></td>
            </tr>

            <tr>
                <td>Appointment Date <input type="date"></td>
            </tr>

            <tr>
                <td>Appointment Time<input type="time"></td>
            </tr>

            <tr>
                <td>Name <input type="text" placeholder="First">  <input type="text" placeholder="Last"></td>
            </tr>

            <tr>
                <td>Gender <input type="radio" value="Male" id="Gender" name="Gender">Male <input type="radio" value="Female" id="Gender" name="Gender">Female</td>
            </tr>

            <tr>
                <td>Mobile NO <input type="number" placeholder="+91 **********"></td>
            </tr>

            <tr>
                <td>Address <input type="city" placeholder="city"> <input type="state" placeholder="state"></td>
            </tr>

            <tr>
                <td>Home address <textarea></textarea></td>
            </tr>

            <tr>
                <td>Appointment Type <input type="checkbox" id="Fewer">Fewer <input type="checkbox" id="Dracing">Dracing <input type="checkbox" id="Headhack">Headhack</td>
            </tr>

            <tr>
                <td><input type="button" value="Submit" align="center"></td>
            </tr>
        </table>
    </form>
</body>
</html>
