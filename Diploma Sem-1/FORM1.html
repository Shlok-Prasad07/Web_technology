<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Registration</title>
    </head>
    <body>
        <form >  

            <!-- style="background-image: url('cloud.jpg')"; -->
            <table  align="center">
            <tr>
                <td>
                    Full name:
                </td>
                <td>
                    <input type="text" placeholder="Full name" name="">
                </td>
            </tr>

            <tr>
                <td>
                    Email:
                </td>
                <td>
                    <input type="Email" placeholder=".com" name="">
                </td>
            </tr>

            <tr>
                <td>
                    Qualification:
                </td>
                <td>
                    <input type=" Qualification" placeholder=" Qualification" name="">
                </td>
            </tr>

            <tr>
                <td>Mobile No:</td>
                <td>
                    <select>
                        <option>+1</option>
                        <option>+44</option>
                        <option>+52</option>
                        <option>+91</option>
                        <option>+86</option>
                    </select>
                    <input type="Phone" placeholder="+**********" name="">
                </td>
            </tr>

            <tr>
                <td>
                    Address:
                </td>
                <td>
                    <input type="Address" placeholder="Address" name="">
                </td>
            </tr>
            <tr>
                <td>Nationality:</td>
                <td>
                    <input type="Nationality" placeholder="Nationality" name="">
                </td>
            </tr>
            <tr>
                <td>DOB:</td>
                <td>
                    <input type="DOB" placeholder="D-M-Y" name="">
                </td>
            </tr>
            <tr>
                <td>
                    Gender:
                </td>
                <td>
                    <input type="radio" id="Gender" name="Gender" value="Male">Male
                    <input type="radio" id="Gender" name="Gender" value="Female">Female
                    <input type="radio" id="Gender" name="Gender" value="Other">Other
                </td>
            </tr>
            <tr>
                <td>Highest Deg:</td>
                <td>
                    <input type="Highest Deg" placeholder="Highest Deg" name="">
                </td>
            </tr>
            <tr>
                <td> Cumulative Performance Index:</td>
                <td>
                    <input type="CPI" placeholder="CPI" name="">
                </td>
            </tr>
            <tr>
                <td>University</td>
                <td>
                    <input type="University" placeholder="University" name="">
                </td>
            </tr>
            <tr>
                <td>
                    Passing Year:
                </td>
                <td>
                    <select>
                        <option>2015</option>
                        <option>2016</option>
                        <option>2017</option>
                        <option>2018</option>
                        <option>2019</option>
                        <option>2020</option>
                        <option>2022</option>
                    </select>
                    <input type=" Passing Year" placeholder=" Conform data Passing Year" name="">
                </td>
            </tr>
            <tr>
                
                <td>
                    <input type="submit"  value="submit" name="">
                </td>
            </tr>

            <!-- <tr>
                <input type="reset" value="cancel">
            </tr> -->
        </table>
        </form>
    </body>
</html>
