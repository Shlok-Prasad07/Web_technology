<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>animation effects</title>
	<style type="text/css">
		body{
			animation-name: shlok;
			animation-duration: 1s;
			animation-iteration-count: infinite;
		}
		@keyframes shlok{
			0%{background-color: red;}
			100%{background-color: yellow;}
		}
	</style>
</head>
<body>
	<div>
		<h1>Give Your Workout A New Style!</h1>
		<br>
		<h1>A New Style!</h1>
		<br>
		<p>Success isn't always about greatness. It's about consistency.Consistent</p> 
		<br>
		<p>hard work gains success. Greatness will come.</p>
	</div>
</body>
</html>
