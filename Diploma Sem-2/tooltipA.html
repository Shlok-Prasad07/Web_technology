<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>tooltip</title>
	<style type="text/css">
		.tooltip{
			position: relative;
			display: inline-block;
			border-bottom: 1px dotted black;
		}
		.tooltip .tooltiptext{
			visibility: hidden;
			width: 2000px;
			/*background-color: black;
			color: #fff;
			text-align: center;
			border-radius: 6px;
			z-index: 1;*/
		}
		.tooltip:hover .tooltiptext{
			visibility: visible;
		}
	</style>
</head>
<body>
	<div class="tooltip">hover me
		<span class="tooltiptext">tooltip.text</span>
	</div>
</body>
</html>
